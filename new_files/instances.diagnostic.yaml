    display_name: 干路电流段范围
    definition: 使用同一适用干路电流且未跨越已确认分流点的母线槽范围
    instance_derivation: trunk_current_segment
    instance_derivation_status: derivable_from_topology
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
