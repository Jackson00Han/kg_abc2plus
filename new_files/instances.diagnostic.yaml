# 实例（A-Box）：手写的诊断层实例（现象、根因、诊断范围、可观测量等）。
# 资产层实例不在此处——它由 mapping.topology_xml.yaml 从 topology.xml 物化得到。
# 本文件将来整体迁入图库。
