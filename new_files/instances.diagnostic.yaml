    parameter_role: duration
    parameter_unit: min
    parameter_binding_status: unresolved
    parameter_value_source: external_parameter_registry
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  ADJACENT_TEMP_DIFF_THRESHOLD:
    type: DiagnosticParameter
    display_name: 相邻温升差阈值
    definition: 相邻接头温升差被判定异常所需的外部配置下界
    parameter_key: joint.adjacent_temperature_difference_limit
    parameter_role: lower_bound
    parameter_unit: K
