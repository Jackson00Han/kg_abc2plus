      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  adjacent_joint_temperature_difference:
    type: DerivedObservable
    display_name: 相邻接头温升差
    definition: 由真实拓扑相邻的两个可测接头温升计算的差异量
    quantity_kind: temperature_difference
    canonical_unit: K
    value_kind: continuous
    derivation_mode: source_calculated
    availability: computed_on_demand
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  joint_temperature_deviation_from_average:
    type: DerivedObservable
    display_name: 接头温升相对均值偏差
    definition: 单一接头温升相对于同一诊断范围内可比较接头温升均值的偏差量
    quantity_kind: temperature_difference
    canonical_unit: K
    value_kind: continuous
    derivation_mode: source_calculated
    availability: computed_on_demand
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  temperature_current_correlation:
    type: DerivedObservable
    display_name: 温升与电流相关性
    definition: 在同一有效时间窗口内温升序列与适用电流序列的统计相关程度
    quantity_kind: statistical_correlation
    canonical_unit: '1'
    value_kind: continuous
    derivation_mode: source_calculated
    availability: computed_on_demand
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  temperature_stability_range:
    type: DerivedObservable
    display_name: 稳态温升波动范围
    definition: 在被判定为稳态的有效时间窗口内温升序列的波动范围
    quantity_kind: temperature_difference
    canonical_unit: K
    value_kind: continuous
    derivation_mode: source_calculated
    availability: computed_on_demand
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  cooling_response_lag:
    type: DerivedObservable
    display_name: 降温响应滞后
    definition: 负载下降后温升响应开始或恢复所表现的时间滞后
    quantity_kind: duration
    canonical_unit: min
    value_kind: continuous
    derivation_mode: source_calculated
    availability: computed_on_demand
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  TEMP_THRESHOLD_EXCEEDED:
    type: Phenomenon
    display_name: 温升阈值超限
    definition: 接头温升满足某一版本规则规定的阈值与持续条件
    diagnostic_scope_status: in_scope
    rule_evaluation_status: produced_by_rule
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  TEMP_RISE_ABNORMAL:
    type: Phenomenon
    display_name: 温升异常
    definition: 温升、趋势或报警表现异常但不限定单一判据
    diagnostic_scope_status: in_scope
    rule_evaluation_status: produced_by_rule
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  CURRENT_LOAD_ABNORMAL:
    type: Phenomenon
    display_name: 电流负载异常
    definition: 负载率或温升与负载关系表现异常
    diagnostic_scope_status: in_scope
    rule_evaluation_status: produced_by_rule
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  JOINT_TEMP_DIFF:
    type: Phenomenon
    display_name: 相邻接头温差异常
    definition: 拓扑相邻接头之间的温升分布表现异常
    diagnostic_scope_status: in_scope
    rule_evaluation_status: produced_by_rule
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  WATER_ALARM:
    type: Phenomenon
    display_name: 进水报警
    definition: 有效进水报警逻辑测点处于触发状态
    diagnostic_scope_status: in_scope
    rule_evaluation_status: produced_by_rule
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  THREE_PHASE_IMBALANCE:
    type: Phenomenon
    display_name: 三相不平衡
    definition: 三相不平衡报警或等价的已确认不平衡现象
    diagnostic_scope_status: outside_current_product_scope
    rule_evaluation_status: produced_by_rule
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  LOCAL_HOTSPOT:
    type: Phenomenon
    display_name: 局部热点
    definition: 单一接头相对于拓扑相邻或同范围可比较接头表现出显著局部温升偏离
    diagnostic_scope_status: in_scope
    rule_evaluation_status: intermediate_criterion_only
    rule_evaluation_note: 当前规则中局部热点只作为 C5 条件1 的中间判据出现，没有任何 D 类规则单独输出它
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  DISTRIBUTED_TEMP_RISE:
    type: Phenomenon
    display_name: 分布式温升异常
    definition: 多个接头或母线槽范围内出现非孤立的持续温升异常分布
    diagnostic_scope_status: in_scope
    rule_evaluation_status: not_evaluated_by_current_rules
    rule_evaluation_note: 知识记录中存在该现象，但 rule_v2.md 2.0.0 没有任何条款能判定它；其候选根因（散热问题、负载过高）目前只能经由其他现象进入。缺口登记为 ONT-109
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  WATER_INGRESS:
    type: RootCause
    display_name: 进水
    definition: 水或潮气进入母线槽或相关部件并可能引发异常
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  OVERLOAD:
    type: RootCause
    display_name: 负载过高
    definition: 负载处于规则规定的高负载区并可能驱动发热；极端过载属于该根因的严重分支
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  LOOSE_BOLTS:
    type: RootCause
    display_name: 螺栓未拧紧
    definition: 接头紧固不足导致接触电阻和局部发热增加
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  CONTACT_OXIDATION:
    type: RootCause
    display_name: 接触面氧化或污染
    definition: 接触面退化或污染导致接触电阻和局部发热增加
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  HEAT_DISSIPATION:
    type: RootCause
    display_name: 散热问题
    definition: 散热条件或降温响应异常导致多点持续发热
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  SINGLE_JOINT_SCOPE:
    type: DiagnosticScope
    display_name: 单接头范围
    definition: 以一个确定的接头实例为诊断中心的范围
    instance_derivation: single_component_instance
    instance_derivation_status: derivable_from_topology
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
  ADJACENT_JOINT_PAIR_SCOPE:
    type: DiagnosticScope
    display_name: 相邻接头对范围
    definition: 由 topology.xml 的真实端口连接证明相邻的两个可测接头范围；成员由 TOPOLOGICALLY_ADJACENT_TO 中 adjacency_evidence_grade=rule_d3_qualified 的边枚举（rule_v2.md D3：JPK 直连 JPK，或经单个直身段 ST 的无分支连续链路，相关端口须全部启用）
    instance_derivation: topologically_adjacent_joint_pair
    instance_derivation_status: derivable_from_topology
    provenance:
      source_refs:
      - BUSWAY_KNOWLEDGE_20260710_V1_3
      status: source_documented
