      status: source_documented
  current_load_ratio:
    type: DerivedObservable
    display_name: 电流负载率
    definition: 实际负载电流相对于适用额定电流的无量纲比例；额定电流取值由工程参数提供
    quantity_kind: ratio
    canonical_unit: '1'
    value_kind: continuous
    derivation_mode: source_calculated
