        value_type: string
        required: true
      document:
        value_type: string
        required: true
      document_version:
        value_type: string
        required: true
      profile_id:
        value_type: string
        required: true
      lifecycle_status:
        value_type: string
        required: true
        allowed_values:
        - active
        - superseded
      rule_content_in_ontology:
        value_type: boolean
        required: true
        const: false
        definition: 规则判据与阈值数值不得搬进本体，本实体只是引用锚点
relation_types:
  CONTAINS:
    display_name: 包含
    category: structural
    layer: structure
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - Project
      - Busway
      - Section
    to:
      endpoint_kind: entity
      allowed_types:
      - Busway
      - Section
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    allowed_type_pairs:
    - from: Project
      to: Busway
    - from: Busway
      to: Section
    - from: Section
      to: EndFeedUnit
    - from: Section
      to: Flange
    - from: Section
      to: Joint
    - from: Section
      to: PlugInUnit
    - from: Section
      to: StraightSection
    persistence: materialized_from_topology
  HAS_PORT:
    display_name: 拥有端口
    category: structural
    layer: port
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    to:
      endpoint_kind: entity
      allowed_types:
      - Port
    persistence: materialized_from_topology
  CONNECTS_TO_COMPONENT:
    display_name: 连接到部件
    category: topology_evidence
    layer: port
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - Port
    to:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    persistence: materialized_from_topology
    source_attribute: Port.Load
    properties:
      port_role:
        value_type: string
        required: true
        allowed_values:
        - input
        - output
        - attachment
        definition: 该端口在所属部件上承担的角色，取自 topology.xml 的端口组态
      port_enabled:
        value_type: boolean
        required: true
        definition: 该端口在组态中是否启用。禁用端口不构成 PRECEDES 证据，进而使相邻判定降级为 disqualified_port_not_enabled
  PRECEDES:
    display_name: 前接于
    category: topology
    layer: topology
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    to:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    persistence: derived_from_port_evidence
    properties:
      evidence_port_refs:
        value_type: array[string]
        required: true
        min_items: 1
        item_reference_kind: stable_ref
      all_ports_enabled:
        value_type: boolean
        required: true
        definition: 构成本条前接关系的两端端口是否均处于启用状态。为假时该链路不得作为 D3 相邻判定的合格证据
  BRANCHES_INTO:
    display_name: 分支连接
    category: topology
    layer: topology
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    to:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    persistence: derived_from_port_evidence
    properties:
      evidence_port_refs:
        value_type: array[string]
        required: true
        min_items: 1
        item_reference_kind: stable_ref
  TOPOLOGICALLY_ADJACENT_TO:
    display_name: 拓扑相邻于
    category: topology
    layer: topology
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    pair_semantics: symmetric_stored_in_flow_direction
    from:
      endpoint_kind: entity
      allowed_types:
      - Joint
    to:
      endpoint_kind: entity
      allowed_types:
      - Joint
    allowed_assertions:
    - derived
    persistence: derived_from_topology_path
    derivation_path:
    - PRECEDES
    interpretation: structural_adjacency_not_current_continuity
    definition_authority:
      document: rule_v2.md
      document_version: 2.0.0
      clause: D3
      note: 相邻判定口径以外置规则 D3 为准，本体不得放宽
    properties:
      evidence_port_refs:
        value_type: array[string]
        required: true
        min_items: 2
        item_reference_kind: stable_ref
        definition: 构成相邻链路的端口序列，逐跳给出。本属性替代早先声明的 evidence_relation_ids——见 constraints.relation_identity
      intermediate_component_refs:
        value_type: array[string]
        required: true
        min_items: 0
        max_items: 1
        item_reference_kind: stable_ref
      path_length:
        value_type: integer
        required: true
        minimum: 1
        maximum: 2
      crosses_branch_point:
        value_type: boolean
        required: true
      all_path_ports_enabled:
        value_type: boolean
        required: true
      adjacency_evidence_grade:
        value_type: string
        required: true
        allowed_values:
        - rule_d3_qualified
        - disqualified_branch_present
        - disqualified_port_not_enabled
        definition: 是否满足 rule_v2.md D3 的相邻链路证据要求；仅 rule_d3_qualified 可进入诊断范围
    scope_eligibility:
      eligible_grade: rule_d3_qualified
      disqualified_edges_are_structural_facts_only: true
    semantic_boundaries:
      current_continuity_assertion: false
      thermal_measurement_assertion: false
      diagnostic_assertion: false
      edge_existence_implies_rule_applicability: false
  HAS_POINT:
    display_name: 拥有逻辑测点
    category: structural
    layer: point
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    to:
      endpoint_kind: entity
      allowed_types:
      - MeasurementPoint
    persistence: materialized_from_topology
    interpretation: acquisition_ownership_not_diagnostic_importance
  OBSERVES:
    display_name: 观测
    category: semantic_binding
    layer: point
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - MeasurementPoint
    to:
      endpoint_kind: entity
      allowed_types:
      - Observable
      - DerivedObservable
    persistence: derived_from_observable_mapping
  EXPOSES_OBSERVABLE:
    display_name: 提供可观测量
    category: semantic_binding
    layer: observable
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    to:
      endpoint_kind: entity
      allowed_types:
      - Observable
      - DerivedObservable
    allowed_assertions:
    - derived
    persistence: derived_materialized_from_relation_path
    derivation_path:
    - HAS_POINT
    - OBSERVES
    properties:
      evidence_point_refs:
        value_type: array[string]
        required: true
        min_items: 1
        item_reference_kind: stable_ref
      path_count:
        value_type: integer
        required: true
        minimum: 1
    semantic_boundaries:
      source_topology_fact: false
      telemetry_assertion: false
      diagnostic_assertion: false
  EXPECTED_OBSERVABLE:
    display_name: 应当具备可观测量
    category: semantic_binding
    layer: observable
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - EndFeedUnit
      - Flange
      - Joint
      - PlugInUnit
      - StraightSection
    to:
      endpoint_kind: entity
      allowed_types:
      - Observable
      - DerivedObservable
    allowed_assertions:
    - expected
    persistence: derived_materialized_from_rule_applicability
    purpose: 表达"本体认为该部件实例应当具备哪些可观测量"。EXPOSES_OBSERVABLE 只表达组态里实际接出了测点，
      两者的差集就是仪表缺口。缺了这一层，一个部件在图上"没有连到某个量"会同时意味着"不该有"和"该有但没装"，
      而这两件事的处置责任完全不同（ONT-116）
    definition_authority:
      kind: derived_within_ontology
      basis: 由该实例所属诊断范围上 scope_role=localization 的现象，取其 criterion_role=rule_criterion
        的判据量推出。全部口径来自 ONT-112/ONT-113 已对账的登记，不引入 rule_v2.md 之外的任何新判断
      derivation_path:
      - HAS_SCOPE_MEMBER
      - INSTANCE_OF_SCOPE
      - APPLICABLE_TO_SCOPE
      - CHARACTERIZED_BY
    granularity_guard:
      expand_to_members_only_when: single_component_instance
      rationale: 只有当诊断范围本身就是"单个部件"时，判据量才落在部件上。多成员范围（相邻接头对、
        干路电流段、母线槽系统）的判据量是范围级的，逐个成员展开会重演 ONT-110——把段级的三相不平衡
        报警当成每个部件都该有的测点
      violation_behavior: reject
    properties:
      via_scope:
        value_type: string
        required: true
      via_scope_instance:
        value_type: string
        required: true
      via_phenomenon:
        value_type: array[string]
        required: true
        min_items: 1
        item_reference_kind: stable_ref
        semantics: 本条应然绑定由哪些现象推出。是集合而非单值——同一个量可能被多个现象共同要求，
          压成分隔符拼接的字符串会让「按现象过滤」必须先解析文本，且分隔符全靠约定
      rule_clause:
        value_type: array[string]
        required: true
        min_items: 1
        semantics: 要求该量的条款号集合。同上，是聚合结果而非单值；声明侧
          （CHARACTERIZED_BY / EVALUATED_BY）的 rule_clause 才是单值，两者语义不同不可混用
      instrumented:
        value_type: boolean
        required: true
      provision:
        value_type: string
        required: true
        allowed_values:
        - source_point
        - computed_on_demand
        semantics: 取自目标可观测量的 availability。只有 source_point 的量缺失才构成仪表缺口；
          computed_on_demand 的量由 DERIVED_FROM 的输入算出，期待它有物理测点是落点误判
      instrumentation_evidence:
        value_type: array[string]
        required: false
        item_reference_kind: stable_ref
    semantic_boundaries:
      source_topology_fact: false
      telemetry_assertion: false
      diagnostic_assertion: false
      instrumentation_assertion: false
      occurrence_assertion: false
  DERIVED_FROM:
    display_name: 派生自
    category: semantic
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - DerivedObservable
    to:
      endpoint_kind: entity
      allowed_types:
      - Observable
      - DerivedObservable
    allowed_assertions:
    - derived
  CHARACTERIZED_BY:
    display_name: 由可观测量表征
    category: semantic
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - Phenomenon
    to:
      endpoint_kind: entity
      allowed_types:
      - Observable
      - DerivedObservable
    allowed_assertions:
    - characterization
    interpretation: knowledge_context_not_rule_match
    properties:
      criterion_role:
        value_type: string
        required: true
        allowed_values:
        - rule_criterion
        - contextual_only
        definition: 该可观测量在权威规则中承担的角色。rule_criterion=被 rule_clause 指定的条款直接读取并参与判定；contextual_only=与现象语义相关但当前规则条款不读取
        rationale: 不区分二者会让本体宽于 rule_v2.md，可视化据此判断"可诊断性"时会得出错误结论（例如把母线槽级报警当作接头级 D1 的判据）
      rule_clause:
        value_type: string
        required_when: criterion_role == rule_criterion
        definition: 读取该量的权威条款编号，必须已在 constraints.rule_alignment.clause_reconciliation 或现象的 EVALUATED_BY 中登记
      criterion_note:
        value_type: string
        required_when: criterion_role == contextual_only
        definition: 说明为何该量不是判据，避免下游误以为遗漏
    semantic_boundaries:
      criterion_role_is_rule_match: false
      contextual_only_implies_irrelevant: false
      criterion_completeness_guaranteed: false
    definition_authority:
      kind: diagnostic_rule
      document: rule_v2.md
      document_version: 2.0.0
      clauses:
      - D1
      - D2
      - D3
      - D4
      - D5
      - D6
      - C5
  SPECIALIZES:
    display_name: 细化为
    category: taxonomy
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - Phenomenon
    to:
      endpoint_kind: entity
      allowed_types:
      - Phenomenon
    allowed_assertions:
    - taxonomic
  MAY_EXHIBIT:
    display_name: 可能呈现
    category: type_template
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity_type
      allowed_types:
      - Joint
      - Busway
    to:
      endpoint_kind: entity
      allowed_types:
      - Phenomenon
    allowed_assertions:
    - possible_applicability
    materialization: forbidden
    instance_expansion: forbidden
  MAY_AFFECT:
    display_name: 可能影响
    category: type_template
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - RootCause
    to:
      endpoint_kind: entity_type
      allowed_types:
      - Joint
      - Busway
    allowed_assertions:
    - possible_applicability
    materialization: forbidden
    instance_expansion: forbidden
  APPLICABLE_TO_SCOPE:
    display_name: 适用于范围
    category: semantic
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - Observable
      - DerivedObservable
      - Phenomenon
      - RootCause
    to:
      endpoint_kind: entity
      allowed_types:
      - DiagnosticScope
    allowed_assertions:
    - scope_applicability
    unresolved_scope_materialization: forbidden
    properties:
      scope_role:
        value_type: string
        required: true
        allowed_values:
        - localization
        - comparison_basis
        - applicability_basis
        - reporting_context
        definition: 该范围在判据中承担的角色。localization=现象断言的落点（每个现象至多一个）；comparison_basis=判据聚合或比较所依据的成员集合；applicability_basis=该量在何范围内有效（如干路电流适用性）；reporting_context=随断言一并上报的上下文粒度，不参与判定也不改变落点
        rationale: 四者混用会导致"在单接头范围内求同范围均值"这类不可执行的声明，或让同一现象出现两个互相矛盾的落点
    definition_authority:
      kind: diagnostic_rule
      document: rule_v2.md
      document_version: 2.0.0
      clauses:
      - D1
      - D2
      - D3
      - D4
      - D5
      - D6
      - C5
      - G3
      - M6
    semantic_boundaries:
      scope_applicability_is_confirmed_diagnosis: false
      localization_scope_implies_comparison_scope: false
  REQUIRES_PARAMETER:
    display_name: 需要参数
    category: semantic
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - Observable
      - DerivedObservable
      - Phenomenon
      - RootCause
    to:
      endpoint_kind: entity
      allowed_types:
      - DiagnosticParameter
    allowed_assertions:
    - parameter_dependency
  HAS_REFERENCE_STATISTIC:
    display_name: 具有参考统计
    category: reference
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - RootCause
    to:
      endpoint_kind: entity
      allowed_types:
      - ReferenceStatistic
    allowed_assertions:
    - descriptive_reference
  EVALUATED_BY:
    display_name: 由规则评估
    category: reference
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - Phenomenon
      - RootCause
    to:
      endpoint_kind: entity
      allowed_types:
      - RuleVersion
    allowed_assertions:
    - rule_binding
    properties:
      rule_clause:
        value_type: string
        required: true
        definition: 该现象或根因在规则文档中对应的条款编号
      clause_role:
        value_type: string
        required: true
        allowed_values:
        - produces_phenomenon
        - produces_root_cause
        - intermediate_criterion
        definition: 该条款相对于本实体的作用；intermediate_criterion 表示实体只作为条款的中间判据，不由该条款单独输出
    semantic_boundaries:
      rule_binding_is_rule_match: false
      rule_binding_implies_data_availability: false
    purpose: 使"改动某版规则会影响哪些现象、哪些根因、进而哪些参数"可在图上一跳查出
  POSSIBLE_CAUSE:
    display_name: 可能原因
    category: candidate_causality
    layer: from_target_node
    direction: directed
    canonical_storage: forward_only
    inverse_traversal: query_only
    from:
      endpoint_kind: entity
      allowed_types:
      - Phenomenon
    to:
      endpoint_kind: entity
      allowed_types:
      - RootCause
    allowed_assertions:
    - possible
    interpretation: candidate_only_not_confirmed_diagnosis
constraints:
  schema:
    file_layout:
      purpose: 一个文件同时扛类型定义、实例、ETL 映射与校验规则，会让"该改哪个文件"无法判断，
        也会把生命周期完全不同的内容绑死在一起——映射随数据源更替，实例随工程迁入图库，
        只有类型定义与校验规则长期保留。拆分后各文件职责单一，换存储/换数据源不必动本体
      loaded_by: tools/build_graph.py 以 ontology.yaml 为入口读取本表，再按表装配其余文件
      files:
        ontology.yaml:
          role: T-Box —— 类型定义、图层划分与校验规则，长期保留
          top_level_keys:
          - metadata
          - sources
          - evidence
          - layers
          - entity_types
          - relation_types
          - constraints
          - compatibility
        mapping.topology_xml.yaml:
          role: ETL 映射 —— 绑定 topology.xml 这一特定数据源，换源即换此文件，本体不动
          top_level_keys:
          - materialization
        instances.diagnostic.yaml:
          role: A-Box —— 手写的诊断层实例；资产层实例由映射从 topology.xml 物化，不落在此
          top_level_keys:
          - entities
          - relations
      missing_key_behavior: reject
      misplaced_key_behavior: reject
      duplicate_key_behavior: reject
    forbidden_legacy_top_level_keys:
    - identity_schemes
    - classes
    - data_properties
    - object_properties
    - concept_catalogs
    - semantic_relations
    - validation
    - compatibility_aliases
    abstract_graph_types_forbidden:
    - Entity
    - Concept
    - Asset
    - Component
    expected_declared_counts:
      entity_types: 18
      relation_types: 20
      entities: 69
      relations: 124
    entity_record:
      required_fields:
      - type
      - provenance
      provenance_required_fields:
      - source_refs
      - status
      business_property_policy: declared_by_entity_type_only
    relation_record:
      required_fields:
      - type
      - from
      - to
      - scope
      - assertion
      - evidence
      - review_status
      optional_fields:
      - materialization
      - instance_expansion
      - scope_role
      - rule_clause
      - rule_basis
      allowed_review_status:
      - source_documented
      - derived_from_rule_reconciliation
      review_status_semantics:
        source_documented: 直接来自知识记录或规则文档的原文陈述
        derived_from_rule_reconciliation: 由本体与外置规则条款对账（ONT-107）补齐的声明，规则原文支持但此前本体未表达
      endpoint_encodings:
        entity:
        - entity
        entity_type:
        - entity_type
  source_authority:
    project_instances: CURRENT_PROJECT_TOPOLOGY
    legacy_domain_source_cannot_assert_current_instances: true
    physical_bindings_remain_external: point_mapping.yaml
    physical_bindings_status:
      activation: inactive_versioned_candidate
      not_a_build_input: true
      rationale: 该文件承载的是「语义点位 → 物理设备/标签/地址/数据提供者」的取数绑定。
        本仓只回答「该不该有这个测点、组态里有没有」，不取值，故不作为构建输入；
        文件自身也声明 production_ready=false、profile_status=inactive_versioned_candidate。
        此处显式记录该状态，避免「声明为权威却从未被读取」被误读成遗漏
      consistency_requirement: 虽不参与构建，但它与 topology.xml 必须描述同一份组态。
        实测三层完全一致——部件集合 11、点位集合 64、物理标识（variable_name 对
        source_point_id）与逻辑单元逐个吻合。该一致性由 tests/test_point_mapping.py 守住，
        其价值在于：将来 topology 新增测点而绑定未跟上时，能在「取不到值」之前就发现
      activation_precondition: 若 production_ready 转为 true，则必须同时决定它由谁消费；
        届时本条声明须一并更新
    rules_remain_external: rule_v2.md
    rules_document_version: 2.0.0
    rules_profile_id: diagnostic64_v2
    external_path_resolution_policy: only_sources_with_path_resolution_required_true_must_resolve
    knowledge_record_resolution_required: false
  identity:
    entity_type_ids_unique: true
    relation_type_ids_unique: true
    declared_entity_ids_unique: true
    declared_relation_ids_unique: true
    project_full_code_unique: true
    project_identity_sources_equal: true
    stable_ref_unique: true
    graph_id_unique: true
    graph_id_template_matches_identity_scheme: true
    port_ordinal_unique_per_owner: true
    point_item_unique_per_owner: true
    diagnostic_parameter_key_unique: true
    reference_statistic_key_unique: true
  relation_integrity:
    type_reference_closure: true
    entity_reference_closure: true
    evidence_reference_closure: true
    endpoint_type_validation: true
    canonical_direction_only: true
    phenomenon_specialization_acyclic: true
  relation_identity:
    declared_relations_carry_stable_id: true
    materialized_relations_carry_stable_id: false
    scope_note: 本段只约束派生边。声明边（instances.diagnostic.yaml 的关系记录）自带 id，
      由 identity.declared_relation_ids_unique 与 compatibility.stable_relation_ids 管辖，不受此处推迟影响。
    identified_by: endpoint_triple
    identity_note: 派生边当前由「(source, rel, target)」唯一确定，没有独立的关系标识符。
    consequence: 因此 item_reference_kind 为 relation_id 的证据属性在本版本中无法落地；
      派生边一律以端点侧的 stable_ref（evidence_port_refs / evidence_point_refs）表达证据。
    rationale: 端口与测点本身就是稳定实体，用它们指证「这条边凭什么成立」既可核对也可回溯；
      而为关系另造一套 id，在没有消费方的情况下只会增加一层需要自己维护的标识空间。
    deferred_to: 图库迁移（Neo4j）。届时关系天然具备 id，是引入关系标识的自然时机，
      且那时才会出现真正的消费方（按边 id 做增量更新与溯源）。
    activation_precondition: 迁移后须同时满足——关系 id 在重建之间稳定、
      证据属性由物化器实际产出、并有测试证明其引用闭合；三者缺一则不得把 relation_id 重新写回本体声明。
  materialization_safety:
    unknown_node_type: reject
    unknown_component_element_type: reject
    unknown_port_type: reject
    unresolved_port_load: reject
    observable_no_match: reject
    observable_cross_target_conflict: reject
    source_point_entities_allowed_types:
    - Observable
    - DerivedObservable
    computed_on_demand_observable_point_mapping: forbidden
    algorithm_route_annotations_grant_applicability: false
    selector_dialect_enforced: true
    disabled_port_source_fact_preserved: true
    disabled_port_proves_operational_connectivity: false
    adjacency_cycle: reject
    adjacency_endpoint_type_mismatch: reject
    adjacency_unknown_intermediate_type: reject
    adjacency_derivation_wider_than_rule_clause: reject
    unresolved_scope_instance_derivation: reject
  semantic_safety:
    type_templates_are_graph_nodes: false
    type_template_instance_expansion: forbidden
    measurement_host_implies_fault_subject: false
    raw_graph_degree_implies_diagnostic_importance: false
    characterized_by_is_rule_match: false
    possible_cause_is_confirmed_diagnosis: false
    topological_adjacency_implies_current_continuity: false
    trunk_current_segment_implies_thermal_comparability: false
    topological_adjacency_implies_rule_applicability: false
    scope_membership_implies_measurability: false
    expected_observable_implies_instrumentation: false
    expected_observable_implies_occurrence: false
    absent_exposes_observable_implies_not_required: false
    outside_scope_phenomenon_has_possible_cause: false
    missing_instance_evidence_behavior: fail_closed
    runtime_measurements_in_ontology: forbidden
    runtime_diagnostic_results_in_ontology: forbidden
    scope_role_required_on_applicable_to_scope: true
    phenomenon_without_localization_scope: reject
    aggregating_criterion_on_single_entity_scope: reject
    localization_scope_reused_as_comparison_basis: reject
  rule_alignment:
    purpose: 本体把诊断规则列为外置权威，必须保证本体内的派生口径与规则条款一致；ONT-107 实证过口径走样会直接污染诊断范围
    authoritative_rules_document: rule_v2.md
    authoritative_rules_version: 2.0.0
    rules_profile_id: diagnostic64_v2
    reconciliation_ledger: to_update.md
    definition_authority_required_for:
    - materialization.topology_xml.relation_mappings
    - materialization.topology_xml.scope_derivations
    - relation_types.APPLICABLE_TO_SCOPE
    - relation_types.CHARACTERIZED_BY
    definition_authority_kinds:
    - source_schema
    - derived_within_ontology
    - diagnostic_rule
    missing_definition_authority: reject
    derivation_wider_than_cited_clause: reject
    rules_document_version_change_requires_reconciliation: true
    unreconciled_clause_behavior: reject
    rule_version_anchor_entity: DIAGNOSTIC_RULES_V2
    every_produced_phenomenon_requires_evaluated_by: true
    every_root_cause_requires_evaluated_by: true
    evaluated_by_clause_must_be_registered: true
    single_localization_scope_per_phenomenon: true
    root_cause_localization_inherits_phenomenon: true
    criterion_role_required_on_characterized_by: true
    criterion_role_requires_registered_clause: true
    criterion_must_be_evaluable_within_localization_scope: warn
    contextual_only_must_not_be_treated_as_criterion: true
    criterion_role_rationale: rule_v2.md 是权威，CHARACTERIZED_BY 本身是 knowledge_context_not_rule_match；若不逐条标出哪些量真被条款读取，下游与体检器只能猜，已实证会把"母线槽级温升报警"当作接头级 D1 的判据（ONT-112）
    clause_reconciliation:
      D1:
        topic: 温升阈值超限
        ontology_constructs:
        - entities.TEMP_THRESHOLD_EXCEEDED
        - SCP_001
        status: reconciled
      D2:
        topic: 电流负载异常
        ontology_constructs:
        - entities.CURRENT_LOAD_ABNORMAL
        - SCP_003
        - SCP_015
        - SCP_016
        status: reconciled
        gap_closed: 此前缺"单接头落点"与"或可证明未分流"两项声明
      D3:
        topic: 相邻接头温差异常
        ontology_constructs:
        - relation_types.TOPOLOGICALLY_ADJACENT_TO
        - scope_derivations.ADJACENT_JOINT_PAIR_SCOPE
        - SCP_004
        - SCP_017
        status: reconciled
        gap_closed: 此前派生口径宽于 D3，且缺"定位后接头"落点声明
      D4:
        topic: 进水报警
        ontology_constructs:
        - entities.WATER_ALARM
        - SCP_005
        - SCP_006
        status: reconciled
      D5:
        topic: 温升异常
        ontology_constructs:
        - entities.TEMP_RISE_ABNORMAL
        - SCP_002
        - SCP_018
        - SCP_019
        - SCP_021
        status: reconciled
        gap_closed: 此前只声明单接头落点，缺电流适用性基准
      D6:
        topic: 三相不平衡
        ontology_constructs:
        - entities.THREE_PHASE_IMBALANCE
        - SCP_007
        status: reconciled
        open_issue: 该现象在本体中无候选根因，与 M3"当前无根因规则"一致
      G3:
        topic: 分流边界门禁
        ontology_constructs:
        - relation_mappings.BRANCHES_INTO
        - scope_derivations.TRUNK_CURRENT_SEGMENT_SCOPE
        status: reconciled
      C5:
        topic: 局部热点与热点计数
        ontology_constructs:
        - entities.LOCAL_HOTSPOT
        - SCP_008
        - SCP_009
        - SCP_020
        - EVL_007
        - EVL_012
        status: reconciled
        gap_closed: 此前热点比较基准最大只到两成员的相邻对，无法承载"范围内热点数量<5"的计数语义
      C1:
        topic: 进水根因
        ontology_constructs:
        - entities.WATER_INGRESS
        - EVL_008
        status: reconciled
      C2:
        topic: 极端过载根因
        ontology_constructs:
        - entities.OVERLOAD
        - EVL_009
        status: reconciled
      C3:
        topic: 螺栓未拧紧根因
        ontology_constructs:
        - entities.LOOSE_BOLTS
        - EVL_010
        status: reconciled
      C4:
        topic: 接触面氧化或污染根因
        ontology_constructs:
        - entities.CONTACT_OXIDATION
        - EVL_011
        status: reconciled
      M6:
        topic: 已分流且缺分支电流时禁止精确判断
        ontology_constructs:
        - scope_derivations.PROVEN_UNSPLIT_EXTENSION_SCOPE
        - semantic_safety.topological_adjacency_implies_current_continuity
        status: reconciled
    clauses_without_ontology_binding:
      policy: rule_v2.md 中出现、但不在 clause_reconciliation 登记的条款，必须在此逐条声明理由；
        未声明者一律视为漏登记。此段解决的是「有意不绑定」与「忘了登记」此前完全无法区分的问题
      criterion: 判据是「该条款的判定是否依赖图谱中的结构性事实」。依赖则必须登记——
        G3 依赖分流拓扑（BRANCHES_INTO）、M6 依赖分支电流可得性，二者均已登记；
        只依赖运行时数据质量或只声明能力边界的，不产生图谱构件，故不登记
      clauses:
        G1:
          kind: data_gate
          reason: 接头温升数据门禁。判定依据是目标对象有无有效 TempDiff、点位数量质量与连续窗口，
            属运行时数据状态。图谱侧的对应物是 EXPECTED_OBSERVABLE 与 instrumented 的差集，
            由 INSTRUMENTATION_GAP 表达，无需条款绑定
        G2:
          kind: data_gate
          reason: 电流数据门禁。缺少总管或分支三相电流属运行时数据状态，同 G1
        G4:
          kind: data_gate
          reason: ConfigError 复核门禁。始端单元类型、进线电流来源、接头测温方案、拓扑节点可测性
            四项必需条件成立与否是组态复核结论，不是本体的类型级事实
        G5:
          kind: rule_dependency_gate
          reason: 依赖 D6 的运行时判定结果来决定 D5 与 C2 是否适用。这是规则之间的执行依赖，
            属规则引擎的调度关注点；建进图谱等于把执行顺序写进本体
        M2:
          kind: capability_boundary
          reason: 异物影响的事前根因推理，在当前六类场景之外，判定结果恒为 NOT_APPLICABLE
        M3:
          kind: capability_boundary
          reason: 当前产品范围没有三相不平衡的根因分类、所需证据与根因规则。
            已在 clause_reconciliation.D6.open_issue 记录该现象无候选根因
        M4:
          kind: capability_boundary
          reason: 绝缘故障根因推理，当前范围之外
        M5:
          kind: capability_boundary
          reason: 温升预测模型及其训练参数与验证准则，当前产品不适用，不运行预测
        M7:
          kind: capability_boundary
          reason: 只有直身温度而无有效 TempDiff 时禁止重算或替代。这是对取数的禁令，
            不产生图谱构件；能否取到该量已由 EXPECTED_OBSERVABLE 的 instrumented 表达

    known_unreconciled:
    - clause: C5 条件1 的"热点数量<5"
      reason: 阈值 5 属数值，按 external_values 策略外置，本体只保证范围可计数
      tracked_as: ONT-108
    - clause: 无对应条款
      subject: entities.DISTRIBUTED_TEMP_RISE
      reason: 知识记录中存在该现象，但 rule_v2.md 2.0.0 无任何条款可判定它；已在实体上标注 not_evaluated_by_current_rules
      tracked_as: ONT-109
    - clause: D1 / D6 判据集
      subject: relations.CHR_002 / CHR_012 / CHR_013 / CHR_014
      reason: 母线槽级温升报警状态与 A/B/C 相电流原始值曾被隐含当作 D1、D6 的判据；已按 criterion_role=contextual_only 收窄，但这些量确有采集，是否应由后续规则版本正式纳入判据待定
      tracked_as: ONT-112
    - clause: D4 定位粒度
      subject: relations.SCP_006
      reason: 母线槽已由 localization 收窄为 reporting_context；若后续需要"整槽进水"级别的断言，须由 rule_v2.md 新增条款而非在本体内扩张
      tracked_as: ONT-113
    - clause: G1 / D1 / D4 / D6 的数据门禁
      subject: BUS1 实测缺口
      reason: BUS1 全槽无 water_ingress_alarm_state、busway_temperature_rise_alarm_state、phase_imbalance_alarm_state 源点位，D4/D6 在 BUS1 恒为 INSUFFICIENT_DATA；这是工程实测差异而非本体缺陷，本体只负责让它在图上可见
      tracked_as: ONT-111
  finding_classification:
    purpose: 体检输出必须自带"谁该动手"，否则读图人会把护栏生效的证据当成待办事项，也会把只能由现场补齐的点位缺口误当成本体缺陷
    rationale: ONT-110 的教训是体检器自己发明了口径；因此检查项到处置责任的映射必须由本体授权，不得写死在物化器里
    unclassified_finding_behavior: reject
    ontology_acceptance_criterion: ontology_defect 类必须为 0；其余四类不是本体的验收标准
    classes:
      ontology_defect:
        definition: "本体自身逻辑不闭合，必须修改本体才能消除"
        owner: "本体维护者"
        note: "包括声明落不了地、判据口径宽于规则、身份不唯一、物化与快照对不上"
      needs_rule_authority:
        definition: "只能由外置权威规则 rule_v2.md 的新版本消除，本体不得自行扩张口径"
        owner: "规则维护者"
        note: "ONT-102 与 ONT-107 已两次实证：本体\"用自己的话重述规则\"就是一次走样机会"
      source_data_defect:
        definition: "源数据 topology.xml 自相矛盾、重复或出现本体未登记的枚举值，须修源文件"
        owner: "拓扑/组态维护者"
        note: "本体按 fail-closed 拒绝而不是猜测，因此这类项一旦出现就会阻断物化"
      data_gap:
        definition: "源数据缺少点位或传感器，只能由现场补齐，本体侧无事可做"
        owner: "现场/采集侧"
        note: "本体的职责是让缺口在图上可见，而不是消灭它；这类项归零不是本体的验收标准"
      by_design:
        definition: "护栏生效的证据。它出现是正确的，它消失才说明护栏失效"
        owner: "无需处置，必须保留"
        note: "例如 D3 把结构相邻但跨分支的接头对判为失格——这条告警正是规则被正确执行的实证"
    findings:
      ADJACENCY_CYCLE:
        class: source_data_defect
        rationale: "拓扑链路成环，物理上不可能"
      ADJACENCY_SNAPSHOT_MISMATCH:
        class: ontology_defect
        rationale: "派生结果与本体自己登记的快照不符，说明派生口径或快照至少有一处已过期"
      ADJACENCY_UNKNOWN_INTERMEDIATE_TYPE:
        class: source_data_defect
        rationale: "链路中出现本体未登记的中间部件类型，按 unknown->reject 拒绝而非猜测"
      CRITERION_CLAUSE_NOT_REGISTERED:
        class: ontology_defect
        rationale: "标为判据却引用了未在 clause_reconciliation 登记的条款"
        tracked_as: ONT-112
      CRITERION_ROLE_MISSING:
        class: ontology_defect
        rationale: "表征边未声明 criterion_role，下游无法判断该量是否为判据（ONT-112 的护栏）"
        tracked_as: ONT-112
      DECLARED_COUNT_MISMATCH:
        class: ontology_defect
        rationale: "声明计数与 expected_declared_counts 不符"
      DECLARED_PROPERTY_MISSING:
        class: ontology_defect
        rationale: "实体缺少其类型声明为 required 的属性，属「声明的必须能落地」在属性维度上的失守"
        tracked_as: ONT-119
      DECLARED_PROPERTY_UNDECLARED:
        class: ontology_defect
        rationale: "实体携带了其类型未声明的业务属性，违反 schema.entity_record.business_property_policy=declared_by_entity_type_only；不拦住就等于承认本体的属性表只是建议"
        tracked_as: ONT-119
      DECLARED_PROPERTY_VALUE_INVALID:
        class: ontology_defect
        rationale: "属性取值违反其声明的 value_type / allowed_values / const / 数量与范围约束；本体自己写了值域却不校验，值域就形同虚设"
        tracked_as: ONT-119
      ENTITY_RECORD_FIELD_VIOLATION:
        class: ontology_defect
        rationale: "实体记录缺 schema.entity_record.required_fields，或 provenance 缺 provenance_required_fields，溯源链断裂"
        tracked_as: ONT-119
      RELATION_RECORD_FIELD_VIOLATION:
        class: ontology_defect
        rationale: "关系记录字段不合 schema.relation_record：缺必填、出现 required/optional 之外的字段、review_status 越界或端点编码非法"
        tracked_as: ONT-119
      EXTERNAL_VALUE_LEAKED_INTO_ONTOLOGY:
        class: ontology_defect
        rationale: "规则取值渗入本体，违反 constraints.external_values。本体只存参数指针与绑定状态，阈值与分布数值一律由外部参数注册表供给；一旦复制进来，规则改值时本体会过期且无人知晓（ONT-102/107 的同一个病）"
        tracked_as: ONT-119
      ENTITY_REFERENCE_CLOSURE:
        class: ontology_defect
        rationale: "关系端点指向不存在的实体"
      ENTITY_TYPE_WITHOUT_LAYER:
        class: ontology_defect
        rationale: "实体类型未声明 layer，物化器无层可查。此前图层硬编码在物化器里，新增类型会静默落到默认层，缺陷不可见"
      ONTOLOGY_FILE_LAYOUT_VIOLATION:
        class: ontology_defect
        rationale: "本体文件拆分后，顶层键缺失、错位或跨文件重复会让装配结果不确定；按 file_layout 的 reject 策略拒绝，防止退回一个文件扛四职责"
      RELATION_TYPE_WITHOUT_LAYER:
        class: ontology_defect
        rationale: "关系类型未声明 layer，物化器无层可查"
      LAYER_REFERENCE_UNDEFINED:
        class: ontology_defect
        rationale: "引用了 layers.definitions 中不存在的层，属于 undefined_layer_reference=reject"
      LAYER_DECLARED_BUT_UNUSED:
        class: ontology_defect
        rationale: "layers.definitions 里定义了却无任何类型/角色/关键字引用的层，是「声明的必须能落地」在图层维度上的同一条要求"
      GRAPH_ID_NOT_UNIQUE:
        class: ontology_defect
        rationale: "identity 规则不足以保证主键唯一"
      HOTSPOT_COUNTABLE:
        class: by_design
        rationale: "C5 的『范围内热点数量 < 5』在该范围可计数，是可求值性成立的实证"
        tracked_as: ONT-108
      HOTSPOT_NOT_COUNTABLE:
        class: ontology_defect
        rationale: "范围内枚举不出可比较的接头，C5 的计数语义无处落地"
        tracked_as: ONT-108
      LOCALIZATION_SCOPE_NOT_UNIQUE:
        class: ontology_defect
        rationale: "现象的落点不唯一，断言无法唯一落地（ONT-113 的护栏）"
        tracked_as: ONT-113
      MATERIALIZED_COUNT_MISMATCH:
        class: ontology_defect
        rationale: "物化计数与 current_source_verification_snapshot 不符"
      OBSERVABLE_ABOVE_LOCALIZATION_SCOPE:
        class: ontology_defect
        rationale: "判据量只在更大范围可得，落点定小了或该量不该作判据"
        tracked_as: ONT-112
      OBSERVABLE_COLLECTED_BUT_UNUSED:
        class: needs_rule_authority
        rationale: "量采到了但诊断侧一条声明都没用到，是否纳入判据须由规则决定"
        tracked_as: ONT-105
      OBSERVABLE_CROSS_TARGET_CONFLICT:
        class: source_data_defect
        rationale: "同一 Item 在不同宿主上解析出互相冲突的可观测量"
      OBSERVABLE_NO_MATCH:
        class: ontology_defect
        rationale: "observable_resolution 未覆盖该 Item，须补映射或显式排除，不得默认丢弃"
      OBSERVABLE_OUTSIDE_ANY_LOCALIZATION_SCOPE:
        class: ontology_defect
        rationale: "采集侧有证据但部件不落在任何用它的现象的落点范围内，声明侧无出口"
      OBSERVABLE_WITHOUT_POINT:
        class: data_gap
        rationale: "本体声明了该量但工程内无任何源点位"
      PHENOMENON_INTERMEDIATE_ONLY:
        class: by_design
        rationale: "中间判据不单独输出结论，是规则的正确表达而非缺陷"
      PHENOMENON_NOT_EVALUABLE:
        class: needs_rule_authority
        rationale: "现象在图上画得出来但无任何条款可判定，须由规则新增条款或从本体降级删除"
        tracked_as: ONT-109
      PHENOMENON_WITHOUT_LOCALIZATION_SCOPE:
        class: ontology_defect
        rationale: "现象没有任何落点，结论无处落地"
      PHENOMENON_WITHOUT_RULE_BINDING:
        class: ontology_defect
        rationale: "规则产出的现象缺 EVALUATED_BY，规则影响面不可追溯"
        tracked_as: ONT-103
      POINT_ITEM_NOT_UNIQUE:
        class: source_data_defect
        rationale: "同一宿主下测点 Item 重复"
      PORT_ORDINAL_NOT_UNIQUE:
        class: source_data_defect
        rationale: "同一部件下 Port 序号重复"
      PRECEDES_DIRECTION_CONFLICT:
        class: source_data_defect
        rationale: "源文件给出的上下游关系互相矛盾"
      PROJECT_IDENTITY_SOURCES_NOT_EQUAL:
        class: source_data_defect
        rationale: "同一工程在源文件不同位置的标识不一致"
      RULE_NOT_EVALUABLE_IN_SCOPE:
        class: data_gap
        rationale: "落点范围所在母线槽内彻底没有该判据量的源点位，该规则在此恒为 INSUFFICIENT_DATA"
        tracked_as: ONT-111
      RULE_SCOPE_NOT_ENUMERABLE:
        class: ontology_defect
        rationale: "本体声明了落点范围却一个实例都枚举不出，违反\"声明的必须能落地\""
      RULE_VERSION_ANCHOR_MISSING:
        class: ontology_defect
        rationale: "缺 RuleVersion 锚点实体，规则版本不可追溯"
        tracked_as: ONT-103
      SCOPE_BELOW_MIN_COMPARABLE_MEMBERS:
        class: data_gap
        rationale: "本工程结构规模不足以支撑该范围的比较基准，本体口径本身没错"
        tracked_as: ONT-106
      SCOPE_COVERAGE_GAP:
        class: by_design
        rationale: "D3 失格判定生效的实证：结构上相邻但规则禁止比较，必须在图上保留可见"
      SCOPE_INSTANCE_MISSING_POINT:
        class: data_gap
        rationale: "同粒度其他实例可得、本实例缺，属点位覆盖不全而非落点选错"
        tracked_as: ONT-114
      INSTRUMENTATION_GAP:
        class: data_gap
        rationale: "本体按判据推出该部件应当具备此可观测量，但组态里没有对应测点。是现场/组态的仪表缺口，不是本体缺陷；它把 ONT-114 从一行文字变成图上可定位的一条边"
        tracked_as: ONT-116
      EXPECTED_OBSERVABLE_GRANULARITY_VIOLATION:
        class: ontology_defect
        rationale: "把多成员范围的范围级判据量逐个展开到成员部件上，等于声称每个部件都该有该测点，重演 ONT-110 的落点误判"
        tracked_as: ONT-116
      SCOPE_REQUIRES_RUNTIME_EVIDENCE:
        class: by_design
        rationale: "fail_closed 生效的实证：缺运行时证据时不生成任何成员，而不是默认放行"
      STABLE_REF_NOT_UNIQUE:
        class: ontology_defect
        rationale: "跨源自然引用不唯一，溯源会指向多个对象"
      TYPE_REFERENCE_CLOSURE:
        class: ontology_defect
        rationale: "实体或属性引用了未定义的类型"
      TYPE_TEMPLATE_TREATED_AS_INSTANCE:
        class: ontology_defect
        rationale: "类型模板伪节点被当成实例枚举进诊断范围，会直接污染范围成员"
      UNKNOWN_COMPONENT_ELEMENT_TYPE:
        class: source_data_defect
        rationale: "源文件出现本体未登记的部件元素类型"
      UNKNOWN_NODE_TYPE:
        class: source_data_defect
        rationale: "源文件出现本体未登记的节点类型"
      UNKNOWN_PORT_TYPE:
        class: source_data_defect
        rationale: "源文件出现本体未登记的 PortType"
      UNRESOLVED_PORT_LOAD:
        class: source_data_defect
        rationale: "Port 的挂载对象无法解析"
  external_values:
    diagnostic_parameter_numeric_values: forbidden
    reference_statistic_distribution_values: forbidden
    forbidden_declared_entity_property_names:
    - value
    - numeric_value
    - threshold_value
    - ratio_value
    - default_value
    reference_statistics_for_scoring: false
    unresolved_parameter_behavior: fail_closed
