layers:
  purpose: 图层是对图谱的语义划分（这个节点/这条边属于哪一层），不是视觉编码（颜色、半径、字号属于可视化模板）。
    此前图层硬编码在 tools/build_graph_v4.py 中，后果有三：换模板即丢失分层；本体新增类型时会静默落到默认层而不报错，
    违反"声明的必须能落地"；下游（GraphRAG 按层检索）要读 Python 源码才知道有哪些层。因此上移到本体，未归层即为 ontology_defect。
  authority: entity_types.*.layer 与 relation_types.*.layer 是唯一权威来源；物化器只允许查表，不得内置默认值或兜底层
  definitions:
    structure:
      display_name: 结构层
      order: 1
      definition: 工程容器（项目/母线槽/分区）及其父子归属，回答"这段母线槽在哪个分区"
    component:
      display_name: 构件层
      order: 2
      definition: 可发生故障的物理构件实例，是诊断定位的落点
    port:
      display_name: 端口层
      order: 3
      definition: 构件的连接端口及其对端引用，是拓扑相邻得以派生的证据层
    topology:
      display_name: 拓扑层
      order: 4
      definition: 构件之间的顺序、分流与相邻关系。只有边、没有节点——拓扑是构件间的关系而非独立实体
    point:
      display_name: 测点层
      order: 5
      definition: 物理测点及其观测绑定，图上"有没有仪表"的唯一依据
    observable:
      display_name: 可观测量层
      order: 6
      definition: 实然（已布点可采集）与应然（规则要求但未必有仪表）两类可观测量，二者之差即仪表缺口
    diagnostic:
      display_name: 诊断层
      order: 7
      definition: 现象、根因、诊断范围与其参数/统计依赖，承载"看到什么—可能是什么"的推断语义
    scope:
      display_name: 定位范围层
      order: 8
      definition: 诊断范围在当前工程上的实例化结果及其成员，回答"这条判据能落在哪几个构件上"
    rule:
      display_name: 规则层
      order: 9
      definition: 外置权威规则的版本锚点，用于标明判据由哪一版规则授权
    type_template:
      display_name: 类型模板层
      order: 10
      definition: 类型层关系的可视化承载伪节点。它不是图上的实体（semantic_safety.type_templates_are_graph_nodes=false），
        单独成层正是为了让读图人一眼分辨"这是类型层的一般性陈述，不是实例事实"
  node_layer_by_kind:
    purpose: 少数节点的层由它在图中的角色（kind）而非实体类型决定，此处显式覆盖 entity_types.*.layer。
      典型是 DiagnosticScope：作为声明的概念它属于诊断层，一旦在本工程上实例化就属于定位范围层
    overrides:
      scope_instance: scope
      type_template: type_template
  relation_layer_keywords:
    from_target_node: 该关系落在其目标节点所在层——声明层关系的层应随语义对象走，
      例如 DERIVED_FROM 指向可观测量就归可观测量层，EVALUATED_BY 指向规则版本就归规则层
  template_endpoint_overrides_relation_layer: true
  graph_only_relation_layers:
    purpose: 这两条边由物化器在实例化诊断范围时生成，按 relation_integrity 的豁免不登记于 relation_types，
      其层在此处授权，避免物化器自行发明
    INSTANCE_OF_SCOPE: scope
    HAS_SCOPE_MEMBER: scope
  assignment_policy:
    entity_type_without_layer: reject
    relation_type_without_layer: reject
    undefined_layer_reference: reject
    layer_declared_but_unused: reject
