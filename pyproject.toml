[project]
name = "sample-graphrag"
version = "0.1.0"
description = "Governed Neo4j GraphRAG workbench with traceable sources and bounded retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "neo4j>=5.28.0,<7.0.0",
    "openai>=1.109.1,<2.0.0",
    "pdfplumber>=0.11.0,<0.12.0",
    "pint>=0.25.2,<1.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.35.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_prod"]
